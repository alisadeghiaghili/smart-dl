name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check smart_dl/ tests/

      - name: Check syntax
        run: |
          python -m py_compile smart_dl/__init__.py
          python -m py_compile smart_dl/__main__.py
          python -m py_compile smart_dl/cli.py
          python -m py_compile smart_dl/main.py
          python -m py_compile smart_dl/utils.py
          python -m py_compile smart_dl/settings.py
          python -m py_compile smart_dl/core/__init__.py
          python -m py_compile smart_dl/core/config.py
          python -m py_compile smart_dl/core/retry.py
          python -m py_compile smart_dl/core/network.py
          python -m py_compile smart_dl/core/proxy.py
          python -m py_compile smart_dl/core/cookies.py
          python -m py_compile smart_dl/core/installer.py
          python -m py_compile smart_dl/core/downloader.py
          python -m py_compile smart_dl/core/queue.py
          python -m py_compile smart_dl/core/history.py
          python -m py_compile smart_dl/core/subscriptions.py
          python -m py_compile smart_dl/core/portable.py
          python -m py_compile smart_dl/core/manager.py
          python -m py_compile smart_dl/core/logging.py
          python -m py_compile smart_dl/extractors/__init__.py
          python -m py_compile smart_dl/extractors/youtube.py
          python -m py_compile smart_dl/extractors/aparat.py
          python -m py_compile smart_dl/extractors/podcast.py
          python -m py_compile smart_dl/extractors/subtitles.py
          python -m py_compile smart_dl/extractors/general.py
          python -m py_compile smart_dl/extractors/gallery.py
          python -m py_compile smart_dl/extractors/torrent.py
          python -m py_compile smart_dl/ui/__init__.py
          python -m py_compile smart_dl/ui/logo.py
          python -m py_compile smart_dl/ui/progress.py
          python -m py_compile smart_dl/ui/themes.py
          python -m py_compile smart_dl/lang/__init__.py

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Test CLI version flag
        run: |
          python -c "from smart_dl.cli import build_parser; build_parser().parse_args(['--version'])"
