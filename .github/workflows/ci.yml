name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check smart_dl/ tests/

      - name: Check syntax
        run: |
          python -m compileall -q smart_dl tests

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Test CLI version flag
        run: |
          python -c "from smart_dl.cli import build_parser; build_parser().parse_args(['--version'])"
