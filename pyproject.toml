[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-dl"
version = "3.0.0"
description = "Resilient media downloader for unstable networks — YouTube, Aparat, podcasts, and 1800+ sites"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Hellch!ef", email = "alisadeghil@gmail.com"}
]
keywords = ["downloader", "youtube", "aparat", "podcast", "yt-dlp", "iran", "proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "yt-dlp>=2024.1.0",
    "rich>=13.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.scripts]
smart-dl = "smart_dl.cli:run_cli"

[project.urls]
Homepage = "https://github.com/alisadeghiaghili/smart-dl"
Repository = "https://github.com/alisadeghiaghili/smart-dl"
Issues = "https://github.com/alisadeghiaghili/smart-dl/issues"

[tool.setuptools.packages.find]
include = ["smart_dl*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
