[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-dl"
version = "3.19.0"
description = "Resilient media downloader for unstable networks — YouTube, Aparat, podcasts, and 1800+ sites"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "Hellch!ef", email = "alisadeghil@gmail.com"}
]
keywords = ["downloader", "youtube", "aparat", "podcast", "yt-dlp", "iran", "proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "yt-dlp>=2024.1.0",
    "rich>=13.0",
    "requests>=2.28",
]

[project.optional-dependencies]
web = [
    "streamlit>=1.30",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0,<2",
    "ruff>=0.1.0",
    "build>=1.0",
]

[project.scripts]
smart-dl = "smart_dl.cli:run_cli"

[project.urls]
Homepage = "https://github.com/alisadeghiaghili/smart-dl"
Repository = "https://github.com/alisadeghiaghili/smart-dl"
Issues = "https://github.com/alisadeghiaghili/smart-dl/issues"

[tool.setuptools.packages.find]
include = ["smart_dl*"]

[tool.mypy]
# mypy tool baseline; package still supports runtime Python 3.9+
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["smart_dl"]
branch = false

[tool.coverage.report]
# Floor matches current measured coverage (~36%); raise deliberately after new tests.
fail_under = 35
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702", "E741"]
